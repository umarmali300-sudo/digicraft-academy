{% extends "base.html" %}
{% block body %}
<main id="content" class="auth-layout">
  <section class="auth-panel">
    {% include "partials/logo.html" %}
    <h1>Choose a new password</h1>
    {% if errors %}<ul class="errors" role="alert">{% for error in errors %}<li>{{ error }}</li>{% endfor %}</ul>{% endif %}
    <form class="stack-form" method="post" action="/reset-password">
      <input type="hidden" name="csrf_token" value="{{ csrf }}">
      <input type="hidden" name="token" value="{{ token }}">
      <label for="password">New Digicraft password</label>
      <input id="password" name="password" type="password" autocomplete="new-password" required>
      <label for="confirm">Confirm password</label>
      <input id="confirm" name="confirm" type="password" autocomplete="new-password" required>
      <button class="button" type="submit">Update password</button>
    </form>
  </section>
</main>
{% endblock %}
